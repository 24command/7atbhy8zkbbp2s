name: Build PhiMod iOS framework
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/PhiMod/**'
      - 'ios/build_unsigned.sh'
      - 'ios/tests/**'
      - 'ios/tools/**'
      - '.github/workflows/build-ios.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test portable gameplay core
        run: bash ios/tests/run_core_tests.sh
      - name: Test generated arm64 judge trampolines
        run: |
          python3 -m venv "$RUNNER_TEMP/judge-tests"
          "$RUNNER_TEMP/judge-tests/bin/pip" install --disable-pip-version-check unicorn==2.1.4
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_judge_patch.py
      - name: Test gameplay gates and protocol
        run: |
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_gameplay_hooks.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_source_contracts.py
      - name: Build arm64 framework
        run: bash ios/build_unsigned.sh "$RUNNER_TEMP/out"
      - name: Verify and archive
        run: |
          file "$RUNNER_TEMP/out/PhiMod.framework/PhiMod"
          xcrun lipo -info "$RUNNER_TEMP/out/PhiMod.framework/PhiMod"
          codesign --verify --verbose "$RUNNER_TEMP/out/PhiMod.framework"
          cd "$RUNNER_TEMP/out"
          ditto -c -k --keepParent PhiMod.framework PhiMod.framework.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhiMod-framework
          path: ${{ runner.temp }}/out/PhiMod.framework.zip
          if-no-files-found: error
          retention-days: 7
