name: Build PhiMod iOS framework
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/PhiMod/**'
      - 'ios/build_unsigned.sh'
      - 'ios/tests/**'
      - 'ios/tools/**'
      - 'ios/shader-compiler/**'
      - '.github/workflows/build-ios.yml'
permissions:
  contents: read
jobs:
  build:
    # Avoid the capacity-constrained macOS ARM host pool; target remains iOS arm64.
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show build environment
        run: |
          echo "Build host: $(uname -m); framework target: iOS arm64"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Syntax-check native OS transitions
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ -std=c++17 -fobjc-arc -fsyntax-only \
            -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -Iios/PhiMod/Vendor \
            ios/PhiMod/Sources/PMNativeOSTransition.mm \
            ios/PhiMod/Sources/PMNativeOSCoordinator.mm \
            ios/PhiMod/Sources/PMNativeOSEntryTimeline.mm \
            ios/PhiMod/Sources/PMNativeOSMap.mm \
            ios/PhiMod/Sources/PMNativeOSProgram.mm \
            ios/PhiMod/Sources/PMNativeOSActions.mm \
            ios/PhiMod/Sources/PMUnlockMedia.mm \
            ios/PhiMod/Sources/PMHookBackend.mm \
            ios/PhiMod/Sources/PMContentRuntime.mm
      - name: Test native OS transition boundaries
        run: |
          python3 -m unittest discover -s ios/tests -p 'test_native_os*.py'
          python3 ios/tests/test_transition_media.py
      - name: Test portable gameplay core
        run: bash ios/tests/run_core_tests.sh
      - name: Test generated arm64 judge trampolines
        run: |
          python3 -m venv "$RUNNER_TEMP/judge-tests"
          "$RUNNER_TEMP/judge-tests/bin/pip" install --disable-pip-version-check unicorn==2.1.4
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_judge_patch.py
      - name: Test gameplay gates and protocol
        run: |
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_gameplay_hooks.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_source_contracts.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_resume_integrity.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_storyboard_failure_isolation.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_merged_selector_records.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_challenge_unlock_access.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_selector_access_details.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_management_resource_contracts.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_native_settings_tab.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_rpe_source_visibility.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_metal_shader_contract.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_runtime_performance_fixes.py
          "$RUNNER_TEMP/judge-tests/bin/python" ios/tests/test_unlock_editor_entry.py
      - name: Test chart conversion and safe archives
        run: bash ios/tests/run_content_tests.sh
      - name: Test iOS Metal shader presets
        run: bash ios/tests/run_shader_tests.sh
      - name: Test full GLSL compiler and generated Metal
        run: |
          cmake -S ios/shader-compiler -B "$RUNNER_TEMP/shader-host" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/shader-host" --target pmshadercompiler-test --parallel 3
          mkdir -p "$RUNNER_TEMP/full-shaders"
          "$RUNNER_TEMP/shader-host/pmshadercompiler-test" "$RUNNER_TEMP/full-shaders"
          for shader in "$RUNNER_TEMP/full-shaders/"*.metal; do
            xcrun --sdk iphoneos metal -std=ios-metal2.3 -c "$shader" -o "$shader.air"
          done
      - name: Build arm64 framework
        run: bash ios/build_unsigned.sh "$RUNNER_TEMP/out"
      - name: Verify and archive
        run: |
          file "$RUNNER_TEMP/out/PhiMod.framework/PhiMod"
          xcrun lipo -info "$RUNNER_TEMP/out/PhiMod.framework/PhiMod"
          xcrun lipo "$RUNNER_TEMP/out/PhiMod.framework/PhiMod" -verify_arch arm64
          codesign --verify --verbose "$RUNNER_TEMP/out/PhiMod.framework"
          python3 - "$RUNNER_TEMP/out/PhiMod.framework/PhiMod" <<'PY'
          import sys
          from pathlib import Path
          binary = Path(sys.argv[1]).read_bytes()
          for marker in (b"PMJudgeHook-v1", b"PMGameplay-v2", b"PMGameplay-contract-v2-88-ios404"):
              assert marker in binary, f"Missing build marker: {marker!r}"
          assert b"PMGameplay-v1" not in binary, "Stale gameplay protocol"
          print("PASS: framework judge/gameplay protocol v2, 88 hooks")
          PY
          cd "$RUNNER_TEMP/out"
          ditto -c -k --keepParent PhiMod.framework PhiMod.framework.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhiMod-framework
          path: ${{ runner.temp }}/out/PhiMod.framework.zip
          if-no-files-found: error
          retention-days: 7
